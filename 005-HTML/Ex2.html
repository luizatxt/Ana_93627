<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
</head>
<body>

    <!-- Cabeçalho com logotipo -->
    <header>
        <center>
        <img src="img2/logo da loja.jpg" style="width:200px; height:200px; border-radius: 50%;" alt="Logotipo da empresa">
        </center>
        <h1>
            <center>Catálogo de Produtos</center>
        </h1>
    </header>

    <!-- Tabela de produtos -->
     <center>
    <table border="1">
        <caption>Produtos Disponíveis</caption>
        
        <!-- Cabeçalho com colspan -->
        <tr>
            <th rowspan="2">Imagem</th>
            <th colspan="2">Informações do Produto</th>
        </tr>
        <tr>
            <th>Nome</th>
            <th>Preço</th>
        </tr>

        <!-- Produto 1 -->
        <tr>
            <td>
                <a href="img2/caneca_estampada.jpg">
                    <img src="img2/caneca_estampada.jpg"  width="200px" height="200px" alt="caneca_estampada">
                </a>
            </td>
            <td>Caneca Estampada</td>
            <td>R$ 29,90</td>
        </tr>

        <!-- Produto 2 -->
        <tr>
            <td>
                <a href="img2/camiseta_algodão.jpg">
                    <img src="img2/camiseta_algodão.jpg" width="200px" height="200px" alt="camiseta_algodão">
                </a>
            </td>
            <td>Camiseta Algodão</td>
            <td>R$ 49,90</td>
        </tr>

        <!-- Produto 3 -->
        <tr>
            <td>
                <a href="img2/agenda.jpg">
                    <img src="img2/agenda.jpg" width="200px" height="200px" alt="agenda">
                </a>
            </td>
            <td>Agenda 2025</td>
            <td>R$ 39,90</td>
        </tr>
    </table>
    </center>

    <!-- Rodapé com informações de contato -->
    <footer>
        <hr>
        <p>Contato: contato@minhaloja.com.br | Telefone: (75) 9234-5678</p>
        <p>Endereço: Rua Exemplo, 123 - Feira de Santana, FSA</p>
    </footer>

</body>
</html>
