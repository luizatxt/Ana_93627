<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Site - Contato</title>
</head>
<body>

    <!-- Cabeçalho com navegação de volta -->
    <header>
        <h1>Fale Conosco</h1>
        <nav>
            <a href="Ex4.html">Home</a>
        </nav>
    </header>

    <!-- Formulário de contato -->
    <form action="#" method="post">
        <fieldset>
            <legend>Formulário de Contato</legend>

            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="assunto">Assunto:</label><br>
            <select id="assunto" name="assunto">
                <option value="duvida">Dúvida</option>
                <option value="pedido">Pedido</option>
                <option value="reclamacao">Reclamação</option>
                <option value="outros">Outros</option>
            </select><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea><br><br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </fieldset>
    </form>

    <!-- Link para voltar -->
    <p><a href="Ex4.html">← Voltar para a Home</a></p>

    <footer>
        <hr>
        <p>&copy; 2025 - Loja Fictícia | contato@lojaficticia.com</p>
    </footer>

</body>
</html>
