<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para o Evento</title>
</head>
<body>
  <h1>
    <center>
        Inscrição para o Evento
    </center>
    </h1>
    <p>Preencha o formulário abaixo para realizar sua inscrição.</p>

    <form>
        <!--Nome Completo-->
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <!--E-mail-->
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <!--Telefone-->
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone"><br><br>

        <!-- Gênero -->
        <p>Gênero:</p>
        <input type="radio" id="masc" name="genero" value="Masculino">
        <label for="masc">Masculino</label>
        <input type="radio" id="fem" name="genero" value="Feminino">
        <label for="fem">Feminino</label>
        <input type="radio" id="outro" name="genero" value="Outro">
        <label for="outro">Outro</label><br><br>

        <!-- Interesses -->
        <p>Interesse no evento:</p>
        <input type="checkbox" id="palestras" name="interesse" value="Palestras">
        <label for="palestras">Palestras</label>
        <input type="checkbox" id="workshops" name="interesse" value="Workshops">
        <label for="workshops">Workshops</label>
        <input type="checkbox" id="networking" name="interesse" value="Networking">
        <label for="networking">Networking</label><br><br>

        <!-- Data -->
        <label for="data">Data de Participação:</label>
        <input type="date" id="data" name="data"><br><br>

        <!-- Botão -->
        <input type="submit" value="Enviar Inscrição">
    </form>
</body>
</html>

</body>
</html>
