<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadrastro de Usuário</title>
</head>
<body>
    <center>
        <h1>Cadrastro de Usuário</h1>
    </center>
    <form action="/submit" method="POST">

        <!--Nome Completo-->
        <label for="nome"> Nome Completo:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <!--E-mail-->
        <label for="email"> E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <!--Senha-->
        <label for="senha"> Senha:</label>
        <input type="senha" id="senha" name="senha" required><br><br>

        <!--Data de Nascimento-->
        <label for="data-nascimento">Data de Nascimento:</label>
        <input type="date" id="data-nascimento" name="data-nascimento" required><br><br>

        <!--Sexo-->
        <label for="sexo">Sexo:</label>
        <input type="radio" id="masculino" name="sexo" value="masculino">
        <label for="masculino">Masculino</label>
        <input type="radio" id="feminino" name="sexo" value="feminino">
        <label for="feminino">Feminino</label><br><br>

        <!--Prefrências-->
        <label for="interesses">Interesses:</label><br>
        <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
        <label for="tecnologia">Tecnologia:</label><br>
        <input type="checkbox" id="musica" name="interesses" value="musica">
        <label for="musica">Musica:</label><br>
        <input type="checkbox" id="esportes" name="interesses" value="esportes">
        <label for="esportes">Esportes:</label><br><br>

        <!-- Cidade-->
        <label for="cidade">Cidade:</label>
        <select id="cidade" name="cidade" required>
            <option value="fsa">Feira de Santana</option>
            <option value="sp">São Paulo</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="bh">Belo Horizonte</option>
        </select><br><br>

        <!-- Botão De Enviar-->
        <input type="submit" value="Cadastrar">

    </form>
    
</body>
</html>
