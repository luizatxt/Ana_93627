<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com Tabelas</title>
</head>
<body>
    <header>
        <h1>
            <center>
                <font color="red" face="Arial">Trabalhando com Tabelas</font>
            </center>
        </h1>
    </header>
    <main>
        <div>
            <h2>
                <center>
                    <font color="red" face="Arial">Tabela de Eletrônicos</font>
                </center>
            </h2>
                <!-- Tabelas HTML-->
                 <center>
                 <table border="1">
                    <tr> <!-- Cabeçalho da tabela-->
                        <th bgcolor="red">Produto</th>
                        <th bgcolor="red">Preço</th>
                        <th bgcolor="red">Quantidade</th>
                    </tr>
                    <tr>
                        <th>Notebook Samsung Book 4</th>
                        <th align="center">R$ 4.200,30</th>
                        <th align="center">50</th>
                    </tr>
                    <tr>
                        <th>Galaxy Watch 8 Classic</th>
                        <th align="center">R$ 8.500,62</th>
                        <th align="center">20</th>
                    </tr>
                    <tr>
                        <th>TV Samsung Philips 50 - tela curva</th>
                        <th align="center">R$ 119.530,20</th>
                        <th align="center">50</th>
                    </tr>
                    <tr>
                        <th>Geladeira Samsung Consul Brastemp</th>
                        <th align="center">R$ 22.200,30</th>
                        <th align="center">14</th>
                    </tr>
                    <tr>
                        <th>Bicicleta Samsung</th>
                        <th align="center">R$ 5.000,30</th>
                        <th align="center">50</th>
                    </tr>
                 </table>
                 </center>
        </div>
    </main>
</body>
</html>
